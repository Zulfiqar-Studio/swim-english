<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf6fc"><title>游泳英文</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf6fc;color:#14334a;font-family:system-ui,-apple-system,sans-serif}main{max-width:540px;margin:auto;padding:16px 16px max(20px,env(safe-area-inset-bottom));min-height:100vh}button{font:inherit;font-weight:750;color:inherit;border:0;border-radius:18px;background:white;cursor:pointer;min-height:52px;padding:12px;touch-action:manipulation}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid #e68b00}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}h1,h2,p{margin:0}h1{font-size:30px}h2{font-size:23px}.home{display:grid;gap:14px;margin-top:28px}.home button{display:flex;align-items:center;gap:18px;text-align:left;padding:24px;font-size:30px}.home small{display:block;font-size:15px;font-weight:500}.symbol{font-size:42px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.category{min-height:125px;font-size:25px}.category span{display:block;font-size:36px}.card{width:100%;background:white;border:3px solid #c9e4f1;box-shadow:0 8px 24px #164e6312;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px}.card svg{width:100%;max-height:235px}.zh{font-size:30px;font-weight:800}.en{font-size:clamp(42px,12vw,72px);font-weight:900;letter-spacing:-2px;color:#075985;line-height:1.1}.hint{background:#fff1ce;color:#754500;border-radius:12px;padding:4px 15px;line-height:1.15;display:flex;align-items:baseline;justify-content:center}.hint span{font-size:var(--s);font-weight:800}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.controls button{font-size:15px}.controls b{display:block;font-size:23px}.nav{display:flex;gap:10px}.nav button{flex:1;font-size:24px}.primary{background:#075985;color:white}.active{background:#075985;color:white}.tile{border:3px solid transparent;display:flex;flex-direction:column;align-items:center;padding:8px;min-height:135px}.tile svg{width:100%;height:94px}.tile strong{font-size:23px}.tile small{font-size:19px}.status{min-height:25px;text-align:center;font-size:14px;margin:8px 0;color:#305a70}.playing{outline:4px solid #0284c7}.correct{border-color:#14804a;background:#dcfce7}.wrong{border-color:#b91c1c;background:#fee2e2}.big{width:100%;font-size:23px;margin:10px 0}.muted{font-size:14px;color:#456578}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{flex:1;padding:8px;min-width:65px}.score{font-size:55px;font-weight:900;text-align:center;margin:20px}.note{text-align:center;font-size:13px;color:#456578;margin-top:16px}button:disabled{opacity:.45;transform:none}.home button:nth-child(1){background:#d9efff}.home button:nth-child(2){background:#d8f4e4}.home button:nth-child(3){background:#ffefce}@media(max-height:680px){.card svg{max-height:170px}.card{padding:9px}.zh{font-size:24px}.controls{margin:7px 0}.en{font-size:45px}} </style></head><body><main id="app"></main><script>
const cats=[['安全','🛑','#fee2e2'],['動作','🏊','#d8f4e4'],['身體','👤','#dbeafe'],['其他','⭐','#fff0cc']];
const rows=[['Stop','停','斯|搭|普','stop'],['Wait','等','威|特','wait'],['Slow','慢','斯|漏','slow'],['No','不行','諾','no'],['Come','過來','康|姆','come'],['Look','看','路|克','look'],['Kick','踢水','ki|克','kick'],['Blow','吹氣','布|漏','blow'],['Up','抬頭','阿|普','up'],['Down','低頭','道|恩','down'],['Jump','跳','詹|普','jump'],['Push','蹬牆','普|許','push'],['Float','浮水','弗|漏|特','float'],['Left','左','雷|夫|特','left'],['Right','右','賴|特','right'],['Hand','手','漢|德','hand'],['Leg','腿','雷|格','leg'],['Head','頭','黑|德','head'],['Goggles','泳鏡','高|格|斯','goggles'],['Cap','泳帽','凱|普','cap'],['Board','浮板','波|德','board'],['Good','很好','古|德','good'],['Again','再一次','呃|根','again']];
// Approximate Mandarin memory cues, not phonetic transcription. Main/lead/tail sizing.
const weights=[[25,43,19],[43,19],[25,43],[43],[43,19],[43,19],[43,19],[25,43],[43,19],[43,19],[43,19],[43,19],[25,43,19],[43,22,19],[43,19],[43,19],[43,19],[43,19],[43,28,19],[43,19],[43,19],[43,19],[25,43]];
rows[6][2]='基|克';
const words=rows.map((r,i)=>({id:i,en:r[0],zh:r[1],hint:r[2],art:r[3],cat:i<6?0:i<13?1:i<18?2:3}));
const app=document.getElementById('app');let screen='home',cat=0,idx=0,slow=false,hints=true,auto=false,token=0,quiz=[],step=0,miss=[],locked=false,choice=[],kind='listen',revealed=false;try{let s=JSON.parse(localStorage.getItem('swim-settings')||'{}');slow=!!s.slow;hints=s.hints!==false}catch(e){}function save(){try{localStorage.setItem('swim-settings',JSON.stringify({slow,hints}))}catch(e){}}
const pool='<rect x="0" y="98" width="240" height="62" rx="8" fill="#b9e8fa"/><path d="M0 112 Q15 104 30 112 T60 112 T90 112 T120 112 T150 112 T180 112 T210 112 T240 112" fill="none" stroke="#2999ca" stroke-width="3"/>';const head=(x,y)=>`<circle cx="${x}" cy="${y}" r="15" fill="#f5bf91" stroke="#14334a" stroke-width="2"/><path d="M${x-13} ${y-3} Q${x} ${y-25} ${x+14} ${y-4}" fill="#f4a524" stroke="#14334a" stroke-width="2"/>`;const line=(d,c='#14334a',w=8)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;const arrow=(d)=>`<path d="${d}" fill="none" stroke="#e05b27" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;const body=(x,y)=>head(x,y)+line(`M${x} ${y+18} v40`,'#087da7',18)+line(`M${x} ${y+57} l-15 28 M${x} ${y+57} l15 28`)+line(`M${x} ${y+25} l-24 20 M${x} ${y+25} l24 20`);
function art(w){let a='';switch(w.art){case 'stop':a='<polygon points="85,12 155,12 200,48 200,112 155,148 85,148 40,112 40,48" fill="#d52b39"/>'+line('M99 112 V65 M112 90 V45 M125 89 V42 M138 90 V50 M151 98 V65 M99 110 Q124 140 151 98 M99 110 L83 91','#fff',10);break;case 'wait':a=pool+body(65,40)+'<circle cx="167" cy="55" r="35" fill="#fff4cb" stroke="#d38800" stroke-width="5"/>'+line('M167 33 V55 L183 65','#985500',5);break;case 'slow':a='<ellipse cx="120" cy="84" rx="49" ry="32" fill="#52ad79" stroke="#185a3a" stroke-width="4"/><circle cx="174" cy="87" r="18" fill="#79c58d"/><circle cx="180" cy="82" r="3"/>'+line('M90 107 l-15 14 M140 108 l15 13','#185a3a',10)+line('M94 64 l48 39 M142 64 l-48 39','#185a3a',3);break;case 'no':a='<circle cx="120" cy="80" r="62" fill="#fce2e2" stroke="#c92537" stroke-width="12"/>'+line('M79 39 L161 121 M161 39 L79 121','#c92537',14);break;case 'come':a=body(62,38)+body(190,42)+arrow('M160 64 H104 M104 64 l20 -17 M104 64 l20 17');break;case 'look':a='<path d="M28 80 Q120 -2 212 80 Q120 162 28 80" fill="white" stroke="#075985" stroke-width="6"/><circle cx="120" cy="80" r="32" fill="#075985"/><circle cx="130" cy="68" r="9" fill="white"/>';break;case 'kick':a=pool+'<rect x="0" y="82" width="28" height="78" fill="#9aaab5"/>'+head(55,81)+line('M68 96 H126','#087da7',20)+line('M126 96 l40 -14 30 12 M126 101 l42 20 30 -12')+line('M48 94 L22 82')+arrow('M207 76 v47 m-9 -10 9 10 9 -10');break;case 'blow':a=pool+head(100,91)+line('M72 93 L32 99','#087da7',18)+'<g fill="#fff" stroke="#2999ca" stroke-width="2"><circle cx="119" cy="110" r="5"/><circle cx="130" cy="125" r="7"/><circle cx="150" cy="111" r="10"/><circle cx="165" cy="137" r="8"/></g>';break;case 'up':case 'down':a=pool+head(97,w.art==='up'?65:103)+line('M97 118 H49','#087da7',18)+arrow(w.art==='up'?'M160 116 V40 m-15 16 15 -16 15 16':'M160 40 V116 m-15 -16 15 16 15 -16');break;case 'jump':a=pool+'<rect x="0" y="83" width="58" height="77" fill="#9aaab5"/>'+head(100,35)+line('M100 55 l15 33','#087da7',18)+line('M104 60 l-25 -10 M104 60 l28 -18 M115 88 l-13 27 M115 88 l25 17')+arrow('M151 36 Q190 56 185 97 m-12 -15 12 15 14 -12');break;case 'push':a=pool+'<rect x="0" y="35" width="24" height="125" fill="#9aaab5"/>'+head(153,91)+line('M137 101 H84','#087da7',20)+line('M84 101 L30 94 M84 105 L30 113 M163 104 H205')+arrow('M92 52 H190 m-17 -12 17 12 -17 12');break;case 'float':a=pool+head(61,94)+line('M80 102 H145','#087da7',20)+line('M145 102 H208 M145 107 L203 116 M91 102 L114 72 M91 102 L114 135');break;case 'left':case 'right':a=arrow(w.art==='left'?'M195 80 H45 M45 80 l42 -35 M45 80 l42 35':'M45 80 H195 M195 80 l-42 -35 M195 80 l-42 35');break;case 'hand':a=line('M100 128 V65 M112 89 V32 M125 89 V24 M138 90 V37 M151 98 V52 M100 120 L75 91 M100 128 Q130 152 151 98','#087da7',12);break;case 'leg':a=head(120,25)+line('M120 45 V88','#a0b5c4',20)+line('M120 87 L91 128 L76 139 M120 87 L150 128 L167 139','#e05b27',14);break;case 'head':a=body(120,45)+'<circle cx="120" cy="45" r="26" fill="none" stroke="#e05b27" stroke-width="5"/>';break;case 'goggles':a=line('M30 65 Q120 10 210 65','#075985',7)+'<rect x="32" y="62" width="73" height="48" rx="21" fill="#a3def5" stroke="#075985" stroke-width="7"/><rect x="135" y="62" width="73" height="48" rx="21" fill="#a3def5" stroke="#075985" stroke-width="7"/>'+line('M105 82 H135','#075985',7);break;case 'cap':a='<path d="M49 105 Q35 24 120 24 Q205 24 191 105 Q120 134 49 105" fill="#f4a524" stroke="#14334a" stroke-width="4"/>'+line('M62 105 Q120 119 178 105','#d17c10',5);break;case 'board':a='<rect x="67" y="12" width="106" height="136" rx="42" fill="#f4a524" stroke="#ab6200" stroke-width="5"/><rect x="94" y="30" width="52" height="19" rx="9" fill="#fff"/>';break;case 'good':a='<circle cx="120" cy="80" r="62" fill="#d8f4e4"/>'+line('M67 82 l34 34 72 -76','#13804a',17);break;case 'again':a='<path d="M174 47 A59 59 0 1 0 179 112" fill="none" stroke="#087da7" stroke-width="12" stroke-linecap="round"/>'+arrow('M174 15 V50 H139');break;}return `<svg viewBox="0 0 240 160" role="img" aria-label="${w.zh}">${a}</svg>`}
const group=()=>words.filter(w=>w.cat===cat);const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let audio=null;let settle=null;function cancel(){token++;auto=false;if(audio){audio.pause();audio=null}if(settle){settle();settle=null}if('speechSynthesis'in window)speechSynthesis.cancel()}function say(w,rate=1){return new Promise(resolve=>{if(audio){audio.pause();if(settle)settle()}let a=new Audio('audio/'+w.art+'.mp3');audio=a;let done=false;const finish=()=>{if(done)return;done=true;if(settle===finish)settle=null;resolve()};settle=finish;a.playbackRate=rate;a.preservesPitch=true;let status=document.getElementById('status');if(status)status.textContent='🔊 播放中';a.onended=()=>{if(status)status.textContent='';finish()};a.onerror=()=>{if(status)status.textContent='無法播放，請檢查網路';finish()};a.play().catch(()=>{if(status)status.textContent='請再點一次播放';finish()})})}function go(s){cancel();screen=s;render()}function header(t){return `<header><button onclick="go('home')" aria-label="首頁">⌂ 首頁</button><h2>${t}</h2></header>`}function tabs(){return `<div class="tabs">${cats.map((c,i)=>`<button class="${cat===i?'active':''}" onclick="selectCat(${i})">${c[0]}</button>`).join('')}</div>`}function selectCat(i){cancel();cat=i;idx=0;render()}function tile(w,click,labels=true){return `<button class="tile" id="tile${w.id}" style="background:${cats[w.cat][2]}" onclick="${click}" aria-label="${w.zh}">${art(w)}${labels?`<strong>${w.en.toUpperCase()}</strong><small>${w.zh}</small>`:''}</button>`}function hint(w){return hints?`<div class="hint" aria-label="發音提示">${w.hint.split('|').map((s,i)=>`<span style="--s:${weights[w.id][i]}px">${s}</span>`).join('')}</div>`:''}function status(){return '<div id="status" class="status" aria-live="polite"></div>'}function render(){if(screen==='home'){app.innerHTML=`<h1>🏊 游泳英文</h1><div class="home"><button onclick="go('categories')"><span class="symbol">📖</span><span>學習<small>看圖・聽英文</small></span></button><button onclick="go('class')"><span class="symbol">🔊</span><span>上課<small>點圖・播英文</small></span></button><button onclick="go('quizmenu')"><span class="symbol">🎧</span><span>測驗<small>聽英文・選圖</small></span></button></div><p class="note">英文語音 · 23 張圖卡</p>`;return}if(screen==='categories'||screen==='quizmenu'){app.innerHTML=header(screen==='categories'?'學習':'測驗')+(screen==='quizmenu'?`<div class="tabs"><button class="${kind==='listen'?'active':''}" onclick="kind='listen';render()">🎧 聽英文</button><button class="${kind==='recall'?'active':''}" onclick="kind='recall';render()">💬 看圖說</button></div>`:'')+`<div class="grid">${cats.map((c,i)=>`<button class="category" style="background:${c[2]}" onclick="${screen==='categories'?`cat=${i};idx=0;go('learn')`:`startQuiz(${i})`}"><span>${c[1]}</span>${c[0]}</button>`).join('')}</div>`+(screen==='quizmenu'?'<button class="big primary" onclick="startQuiz(-1)">全部測驗</button>':'');return}if(screen==='learn'){let w=group()[idx];app.innerHTML=header(cats[cat][0]+' '+(idx+1)+' / '+group().length)+`<button onclick="go('categories')">← 分類</button><button class="card" onclick="manual(${w.id})">${art(w)}<div class="zh">${w.zh}</div><div class="en">${w.en.toUpperCase()}</div>${hint(w)}<small>🔊 點圖聽英文</small></button>${status()}<div class="controls"><button class="${slow?'active':''}" onclick="slow=!slow;save();render()"><b>🐢</b>${slow?'慢速':'正常'}</button><button class="${auto?'active':''}" onclick="toggleAuto()"><b>${auto?'■':'▶'}</b>${auto?'停止':'連續播'}</button><button onclick="hints=!hints;save();render()"><b>${hints?'👁':'◉'}</b>${hints?'藏諧音':'顯示諧音'}</button></div><div class="nav"><button onclick="move(-1)">←</button><button class="primary" onclick="move(1)">→</button></div><p class="note">諧音只是提示，請跟著英文聲音念。</p>`;return}if(screen==='class'){app.innerHTML=header('上課')+tabs()+`<div class="grid">${group().map(w=>tile(w,`classPlay(${w.id})`)).join('')}</div>${status()}<p class="note">安全指令需配合手勢及現場監督。</p>`;return}if(screen==='quiz'){drawQuiz();return}if(screen==='result'){app.innerHTML=header('完成')+`<div class="score">${quiz.length-miss.length} / ${quiz.length}</div>${miss.length?'<h2>再練一次</h2><div class="grid">'+miss.map(w=>tile(w,`manual(${w.id})`)).join('')+'</div><button class="big primary" onclick="retry()">只練錯題</button>':'<h2 style="text-align:center">✓ 全部答對</h2>'}${status()}<button class="big" onclick="go('quizmenu')">再測驗</button>`}}
function manual(id){cancel();render();say(words[id],slow?.7:1)}function classPlay(id){cancel();document.querySelectorAll('.tile').forEach(x=>x.classList.remove('playing'));let el=document.getElementById('tile'+id);el?.classList.add('playing');say(words[id],1).then(()=>el?.classList.remove('playing'))}function move(n){cancel();idx=(idx+n+group().length)%group().length;render()}async function toggleAuto(){if(auto){cancel();render();return}cancel();auto=true;let t=token;render();while(auto&&t===token&&screen==='learn'){for(let j=0;j<3;j++){if(!auto||t!==token)return;await say(group()[idx],slow?.7:1);if(!auto||t!==token)return;await new Promise(r=>setTimeout(r,3000))}if(!auto||t!==token)return;idx=(idx+1)%group().length;render()}}
function startQuiz(c){cancel();quiz=sh(c===-1?words:words.filter(w=>w.cat===c));step=0;miss=[];screen='quiz';nextQuestion()}function retry(){quiz=sh(miss);step=0;miss=[];screen='quiz';nextQuestion()}function nextQuestion(){locked=false;revealed=false;let w=quiz[step];choice=sh([w,...sh(words.filter(x=>x.id!==w.id&&x.cat===w.cat)).slice(0,3)]);render()}function drawQuiz(){let w=quiz[step];app.innerHTML=header((step+1)+' / '+quiz.length)+(kind==='listen'?`<button class="big primary" onclick="say(words[${w.id}],slow?.7:1)">🔊 聽英文</button><div class="grid">${choice.map(x=>tile(x,`answer(${x.id})`,false)).join('')}</div>`:`<div class="card">${art(w)}<div class="zh">${w.zh}</div>${revealed?`<div class="en">${w.en.toUpperCase()}</div>`:'<div class="en">?</div>'}</div><button class="big primary" onclick="reveal()">🔊 聽答案</button>${revealed?'<div class="nav"><button onclick="selfAnswer(false)">再練</button><button class="primary" onclick="selfAnswer(true)">會了 ✓</button></div>':''}`)+status()+'<div id="feedback"></div>'}function answer(id){if(locked)return;locked=true;let w=quiz[step];if(id!==w.id)miss.push(w);document.getElementById('tile'+w.id).classList.add('correct');if(id!==w.id)document.getElementById('tile'+id).classList.add('wrong');document.getElementById('feedback').innerHTML=`<h2 style="text-align:center">${id===w.id?'✓':'再聽一次'} ${w.en.toUpperCase()}</h2><button class="big primary" onclick="advance()">下一題 →</button>`;say(w,slow?.7:1)}function reveal(){revealed=true;drawQuiz();say(quiz[step],slow?.7:1)}function selfAnswer(ok){if(!ok)miss.push(quiz[step]);advance()}function advance(){cancel();step++;if(step>=quiz.length){screen='result';render()}else nextQuestion()}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
